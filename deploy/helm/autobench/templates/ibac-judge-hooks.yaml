{{- if and .Values.ibacJudge.enabled .Values.ibacJudge.managePlatformConfig }}
{{- /*
Set rossoctl-platform-config's ibac.judgeEndpoint/judgeModel on install, put them back on uninstall.

The rationale for a hook rather than a template is in files/platform-config-ibac.py — short version:
that ConfigMap belongs to the `rossoctl` release, and Helm owns objects, not fields inside another
release's object. The judge WORKLOAD is chart-owned (ibac-judge.yaml); only these two keys need
bookkeeping, and the bookkeeping is one ConfigMap recording what they said first.

The ServiceAccount, Role and RoleBinding are ordinary release resources, NOT hook resources, for one
specific reason: Helm deletes a release's resources AFTER its pre-delete hooks run, so the restore
Job still has its permissions at the moment it needs them. Hook-annotated RBAC would either be
deleted too early or survive the uninstall as orphans.

The Role is scoped by resourceName to exactly two ConfigMaps and one Job. It cannot read a Secret,
and it cannot touch any other platform object.
*/}}
{{- $ns := .Release.Namespace }}
{{- $judge := include "autobench.judgeName" . }}
{{- $hook := printf "%s-config" $judge }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $hook }}
  namespace: {{ $ns }}
  labels:
    {{- include "autobench.judgeLabels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $hook }}
  namespace: {{ $ns }}
  labels:
    {{- include "autobench.judgeLabels" . | nindent 4 }}
rules:
  # The platform's ConfigMap: read and patch the two fields. No create, no delete.
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: [{{ .Values.ibacJudge.platformConfigMap | quote }}]
    verbs: ["get", "patch"]
  # Our own record of the prior values: created by the apply hook, removed by the restore hook.
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: [{{ printf "%s-prior" $judge | quote }}]
    verbs: ["get", "create", "patch", "delete"]
  # create is namespace-wide because a resourceName cannot gate it — the object does not exist yet.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]
  # The restore hook's last act is to delete the apply hook's Job, which survives its own success so
  # its log stays readable while the release lives. Nothing else would ever clean it up.
  - apiGroups: ["batch"]
    resources: ["jobs"]
    resourceNames: [{{ printf "%s-apply" $hook | quote }}]
    verbs: ["delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $hook }}
  namespace: {{ $ns }}
  labels:
    {{- include "autobench.judgeLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $hook }}
subjects:
  - kind: ServiceAccount
    name: {{ $hook }}
    namespace: {{ $ns }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $hook }}-code
  namespace: {{ $ns }}
  labels:
    {{- include "autobench.judgeLabels" . | nindent 4 }}
data:
  platform-config-ibac.py: |
{{ .Files.Get "files/platform-config-ibac.py" | indent 4 }}
{{- /*
The two Jobs clean up differently, and the asymmetry is deliberate.

`apply` keeps its Job after success: the log is the only record of what the prior ibac pair was at the
moment of the patch, and `before-hook-creation` already stops them accumulating — the next upgrade
replaces it. `restore` must delete itself on success, because by then the release is gone and a hook
resource is not a release resource: nothing else would ever remove it.

Neither deletes on FAILURE, either way. A failed hook's log is the only thing that explains why, and
for `restore` the failure also blocks the uninstall on purpose.
*/}}
{{- range $mode, $spec := dict "apply" (dict "hook" "post-install,post-upgrade" "weight" "5" "cleanup" "before-hook-creation") "restore" (dict "hook" "pre-delete" "weight" "-5" "cleanup" "before-hook-creation,hook-succeeded") }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $hook }}-{{ $mode }}
  namespace: {{ $ns }}
  labels:
    {{- include "autobench.judgeLabels" $ | nindent 4 }}
  annotations:
    "helm.sh/hook": {{ $spec.hook }}
    "helm.sh/hook-weight": {{ $spec.weight | quote }}
    "helm.sh/hook-delete-policy": {{ $spec.cleanup }}
spec:
  backoffLimit: 2
  # Bounded so a wedged hook cannot hold an uninstall open indefinitely.
  activeDeadlineSeconds: 120
  template:
    metadata:
      labels:
        {{- include "autobench.judgeLabels" $ | nindent 8 }}
    spec:
      serviceAccountName: {{ $hook }}
      restartPolicy: Never
      containers:
        - name: patch
          image: {{ $.Values.ibacJudge.image }}
          command: ["python", "/app/platform-config-ibac.py"]
          env:
            - name: MODE
              value: {{ $mode | quote }}
            - name: NAMESPACE
              value: {{ $ns | quote }}
            - name: TARGET_CM
              value: {{ $.Values.ibacJudge.platformConfigMap | quote }}
            - name: PRIOR_CM
              value: {{ printf "%s-prior" $judge | quote }}
            - name: JUDGE_APP
              value: {{ $judge | quote }}
            - name: APPLY_JOB
              value: {{ printf "%s-apply" $hook | quote }}
            # Derived, never configured: it is this chart's own Service, so it cannot disagree with
            # the Service actually rendered. The plugin gets an in-cluster URL with no credential in
            # it — the key stays in the proxy's Secret.
            #
            # BASE URL ONLY — no /v1/chat/completions. The ibac plugin appends the chat path to
            # whatever this field holds, so a path here is sent twice and the judge answers
            # `POST /v1/chat/completions/v1/chat/completions -> 404`. That fails one judge call at a
            # time, which fails the TASK under `ibac-only`/`full` and is swallowed under
            # `ibac:observe` — so it reads as a flaky model, not as a config error. Measured on ykt5
            # 2026-10-01: 5 task failures across legs #6 and #7, and the hand-configured clusters
            # were never affected because they were set to the bare base by hand.
            - name: JUDGE_ENDPOINT
              value: http://{{ $judge }}.{{ $ns }}.svc.cluster.local:{{ $.Values.ibacJudge.port }}
            - name: JUDGE_MODEL
              value: {{ $.Values.ibacJudge.model | quote }}
          volumeMounts:
            - name: code
              mountPath: /app
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: code
          configMap:
            name: {{ $hook }}-code
{{- end }}
{{- end }}
