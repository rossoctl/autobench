# Values for the AutoBench Service chart.
#
# The chart is a faithful generalisation of deploy/deployment.yaml, deploy/service.yaml,
# deploy/openshift/deployment-patch.yaml and deploy/kind/httproute.yaml — it renders the same
# objects those produce. `python3 reference/helm-parity-check.py` asserts exactly that, and is the
# chart's correctness gate — run it after any template change.

# Prerequisite, either platform: the target cluster runs **Rossoctl v0.8.0 or later**. Below that,
# the operator's deploy contract drops fields the Service sends (k8sResourceLimits among them)
# without erroring, so the benchmark deploys and runs in a shape nobody asked for.
# reference/ocp-service-bootstrap.sh asserts the version before it writes an instance file.
#
# Which platform shape to render:
#   openshift -> let the restricted-v2 SCC inject the UID/GID, and expose via a Route
#   kind      -> pin UID 10001, and expose via an HTTPRoute on the shared istio gateway
#
# Both shapes are installed and validated on a live cluster: `openshift` on a sample OpenShift
# cluster (ykt5), `kind` on kind-rossoctl (2026-09-29). The two clusters that predate the chart
# were ADOPTED into releases rather than reinstalled — a Deployment's selector is immutable, so
# a chart cannot replace an existing object, only take ownership of it. See docs/ADMIN_GUIDE.md
# ("Adopting an existing raw-manifest install").
platform: openshift

# Where the LLM or LiteLLM service this cluster's workloads call sits: intranet | internet
# (empty = undeclared). Any OpenAI-compatible service will do; the profile records which network
# yours is on, because that is what decides whether this cluster can reach it at all.
#
# ORTHOGONAL TO `platform`, deliberately, and the rule is asymmetric. An Internet cluster — kind or
# OpenShift alike — must be given credentials for a service ON the Internet, because an intranet
# service is not routable from it. An intranet cluster may use either, so it has a real choice and
# this value is the record of it. Both platforms occur on both networks: OpenShift is commonly
# deployed on the organisation's intranet, and a kind cluster runs on an Internet server as readily
# as on a laptop on the VPN. Nothing derives one value from the other.
#
# The chart does NOT render this into the Service pod, because the Service does not read the gateway
# from its environment — the gateway is `workload_llm.api_base` in the instance-config Secret, which
# the chart references and never creates (see `instancesSecret` below), and the Service injects
# OPENAI_API_BASE/LLM_API_BASE from it onto each workload pod at deploy time. So this value has two
# jobs, both real:
#
#   1. it is the single declaration of intent, read by reference/{kind,ocp}-service-bootstrap.sh
#      (`--llm-profile`, or `LLM_PROFILE`) so the instance file they write cannot disagree with the
#      release that is installed beside it;
#   2. reference/preflight.py FAILS when the live instance file's api_base is not this profile's
#      base — which turns "401 per completion, mid-run, leg finishes with zeroes" into a pre-install
#      error, the whole reason the two profiles are named rather than typed out per cluster.
#
# The bases, models and key files themselves are NOT chart values: they are the INTRANET_LLM_* /
# INTERNET_LLM_* environment sets documented in reference/llm-profiles.sh, because one of them is a
# credential path and this repo is public.
llmProfile: ""

image:
  repository: ghcr.io/rossoctl/autobench
  # Defaults to .Chart.AppVersion when empty.
  tag: ""
  # Every tag is immutable, so IfNotPresent is correct and avoids a pull per restart.
  pullPolicy: IfNotPresent

replicas: 1

service:
  port: 8080

# The per-instance config bundle: one JSON file per issuer, mounted read-only at
# /etc/service/instances. The chart REFERENCES this Secret and never creates it — it holds ROPC
# service credentials, so it is generated out-of-band by reference/kind-service-bootstrap.sh or
# reference/ocp-service-bootstrap.sh and must not pass through Helm values or a values file.
instancesSecret: autobench-instances

# Pod-level security context. runAsUser/runAsGroup/fsGroup are dropped automatically when
# platform is openshift (pinning 10001 can be REJECTED if it falls outside the project's
# allocated UID range); the image is arbitrary-UID-safe either way.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 0
  fsGroup: 10001

# OpenShift Route. Rendered only when platform is openshift and this is enabled.
route:
  enabled: true
  # Empty host lets the router generate <name>-<namespace>.apps.<cluster>.
  host: ""
  tls:
    termination: edge

# Gateway API HTTPRoute — kind/dev only. Rendered only when platform is kind and enabled.
# In production the Service runs behind its own ingress and does not attach to the target
# cluster's gateway.
httpRoute:
  enabled: true
  hostname: autobench.localtest.me
  gateway:
    name: http
    # Defaults to the release namespace when empty.
    namespace: ""

# The IBAC judge — the upstream proxy the AuthBridge `ibac` plugin calls to decide whether a tool
# call is allowed. Needed only by the plugin legs of the benchmark matrix (#5–#8).
#
# WHY IT IS IN THIS CHART AT ALL. Rossoctl does not ship a judge: `rossoctl-platform-config` arrives
# with every `ibac.*` field empty, and a cluster with no benchmark workloads never needs one. The
# judge on these clusters exists for benchmarking and nothing else, so AutoBench owns it — and
# ownership has to be symmetric. `helm install` creates it; `helm uninstall` takes it away. Nothing
# is left behind for the next person to find and wonder about.
#
# Two exceptions to that, both deliberate and both printed by NOTES.txt:
#
#   * the upstream KEY (`upstreamSecret` below) is referenced, never created — it is a credential,
#     installed out-of-band, so it is removed out-of-band too.
#   * `rossoctl-platform-config`'s ibac.judgeEndpoint/judgeModel are not objects but keys inside a
#     ConfigMap owned by the `rossoctl` release. Helm owns objects, not fields in another release's
#     object, so those two keys are set by a post-install hook that first RECORDS what they said, and
#     put back by a pre-delete hook. See files/platform-config-ibac.py.
#
# Off by default: a cluster that only ever runs legs #1–#4 and #9–#12 does not need it, and an
# install that creates a judge nobody asked for is the mirror of the problem this block solves.
ibacJudge:
  enabled: false

  # REQUIRED when enabled, and not committed to any values file in this public repo: the LLM or
  # LiteLLM service this cluster's workloads already call. The judge is one more caller of it, and no
  # two services share a key table, so it must be the SAME one — pass the selected profile's
  # <INTRANET|INTERNET>_LLM_API_BASE at install time.
  upstreamBase: ""

  # REQUIRED when enabled: a model id THAT gateway lists in GET /v1/models. It need not be the model
  # the benchmark itself runs, and it is priced separately — reference/model_prices.json's judge row
  # is what gen-cost-analysis.py bills these calls at, and judge calls do NOT appear in
  # report.ndjson. A model the judge's key cannot see fails one judge call at a time, mid-leg.
  #
  # A CATALOGUE ID, NOT A LITELLM CLIENT STRING — no `openai/` prefix. The plugin sends this value
  # verbatim as the wire `model`, so it is the exact opposite of the Service's
  # `workload_llm.default_model`, which SHOULD keep the prefix because the agent's litellm client
  # strips it before calling. Measured on ykt5 2026-10-01: `Azure/gpt-4.1` is granted,
  # `openai/Azure/gpt-4.1` matches no alias and the gateway routed it to an OpenAI passthrough the
  # team has no entitlement for — 403 "team not allowed to access model" on every judge call, which
  # failed legs #6 and #7 and was invisible in #8 because ibac:observe swallows it.
  #
  # Use a NON-REASONING model. A reasoning model can spend its whole budget on reasoning and return
  # empty content (`finish_reason: length`), which is useless for a judge that must emit a short
  # verdict — so gpt-5-mini is a bad judge and gpt-4.1 is a good one.
  model: ""

  # Referenced, NEVER created — see above. Key `apikey`. The proxy reads it once at start, so a key
  # installed after the pod is up needs `kubectl rollout restart deploy/ibac-judge`.
  upstreamSecret: ibac-judge-upstream

  # Set false to install the judge workload but leave rossoctl-platform-config alone — for a cluster
  # whose ibac fields are managed elsewhere. The plugin then stays INERT until something else points
  # it here: it admits every tool call and the legs still pass, so prove enforcement by counting
  # judge calls (reference/preflight.py --plugin-legs checks the fields are set).
  managePlatformConfig: true
  platformConfigMap: rossoctl-platform-config

  port: 8080
  # There is deliberately no chat-path knob. `ibac.judgeEndpoint` must be a BASE url, because the
  # ibac plugin appends `/v1/chat/completions` itself — a path configured here arrives doubled and
  # every judge call 404s silently-ish (it fails tasks, not the deploy). See ibac-judge-hooks.yaml.
  # Stdlib-only proxy, so a stock python image needs no build and no pip install at start. Also used
  # by the two hook Jobs. mirror.gcr.io avoids docker.io's anonymous pull throttle.
  image: mirror.gcr.io/library/python:3.12-slim
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

# Permission for the Service to WRITE its own spans to MLflow. Reading MLflow needs no grant; writing
# is authorized against the MLflow operator's ClusterRole in the namespace named by the MLflow
# WORKSPACE the Service sends (`mlflow.workspace` in the instance config), and without it every export
# is a 403 — silently, because a trace missing the Service's root span is dropped when the report is
# built, so the run passes and publishes empty report.ndjson / token_report.ndjson.
# See templates/mlflow-trace-writer.yaml.
#
# Off here and ON in deploy/helm/values-openshift.yaml, rather than derived from `platform`: the
# ClusterRole below is RHOAI MLflow's, and kind installs use a plain no-auth mlflow-reader that
# authorizes nothing. Explicit beats inferred — but note that leaving it off on an OpenShift cluster
# buys empty token reports and no error, so `reference/preflight.py` checks for the binding too.
mlflowTraceWriter:
  enabled: false
  # The identity the SERVICE authenticates to MLflow as — the account whose token is
  # `mlflow.bearer_token` in the instance-config Secret. Created out-of-band, with its token
  # Secret, by reference/ocp-mlflow.sh (autobench-install.sh step 3b), which records that it did;
  # reference/ocp-service-bootstrap.sh copies the token. Referenced here, never created.
  serviceAccount: mlflow-reader
  # MLflow operator's ClusterRole. Platform-owned: referenced, never created.
  clusterRole: mlflow-operator-mlflow-integration
  # The MLflow WORKSPACE namespaces to bind, on THIS cluster — not the namespaces agents run in.
  # On a single-cluster install the two are the same string, so the distinction only shows up in the
  # split shape: the agents live on the other cluster, while the MLflow the Service exports to is
  # in-cluster here, and this is where it reads the binding from. A workspace missing here produces
  # exactly the empty-report symptom described above, for that workspace only.
  namespaces:
    - team1

# Extra container env, appended after SERVICE_INSTANCES_DIR and SERVICE_PORT.
extraEnv: []

resources: {}

nodeSelector: {}
tolerations: []
affinity: {}
