# ykt5: OpenShift, Service and workloads on the SAME cluster (unlike ykt3, which hosts only the
# Service and drives ykt2). Install with:
#
#   helm upgrade --install autobench deploy/helm/autobench \
#     -n rossoctl-system --kube-context <ykt5> -f deploy/helm/values-ykt5.yaml
#
# The instance-config Secret must exist first — see the chart's values.yaml.
platform: openshift

# ykt5 is reached from outside the organisation's network, so it uses the EXTERNAL gateway. This is
# a property of the cluster's placement, not of OpenShift: an OpenShift cluster on the intranet
# would declare `intranet` here and use the same gateway a local kind cluster does.
llmProfile: internet

route:
  enabled: true
  # Empty: the router generates autobench-<namespace>.apps.<cluster>, matching ykt3's Route.
  host: ""
  tls:
    termination: edge
