# An OpenShift cluster with the Service and workloads on the SAME cluster (unlike the split shape,
# where one cluster hosts only the Service and drives workloads on another). `ykt5`, `ykt3` and
# `ykt2` below are the clusters this project happens to run on — sample names, not requirements;
# copy this file and substitute your own. Install with:
#
#   helm upgrade --install autobench deploy/helm/autobench \
#     -n rossoctl-system --kube-context <ykt5> -f deploy/helm/values-ykt5.yaml
#
# The instance-config Secret must exist first — see the chart's values.yaml.
platform: openshift

# This cluster sits on the Internet, so it must be given credentials for an LLM or LiteLLM service
# on the Internet — an intranet service is not routable from it. That is a property of the
# cluster's placement, not of OpenShift: an OpenShift cluster on the intranet would declare
# `intranet` here, exactly as a kind cluster on the intranet may.
llmProfile: internet

route:
  enabled: true
  # Empty: the router generates autobench-<namespace>.apps.<cluster>, matching ykt3's Route.
  host: ""
  tls:
    termination: edge
