# The ibac judge upstream proxy — KinD copy of the objects running on ykt2.
#
# What it is for: the AuthBridge `ibac` plugin calls a judge model to decide whether a tool call is
# allowed. The plugin's ConfigMap is cleartext, so the upstream key cannot live there; this proxy
# holds the key in a Secret and adds the `Authorization` header on the way out, so the plugin only
# ever points at an in-cluster URL with no credential:
#
#     judgeEndpoint: http://ibac-judge.rossoctl-system.svc.cluster.local:8080
#
# A BASE url, with no /v1/chat/completions: the plugin appends the chat path itself. Configure a path
# here and the judge gets `POST /v1/chat/completions/v1/chat/completions -> 404`, one failed judge
# call per tool call — which fails tasks under `ibac-only`/`full` and is swallowed under
# `ibac:observe`. The proxy below still SERVES /v1/chat/completions; it is the caller that builds it.
#
# Without it the plugin is inert — it admits every call and the run looks like a clean pass. The way
# to prove enforcement is to COUNT judge calls, not to read the pass rate.
#
# UPSTREAM_BASE below is a PLACEHOLDER: this repo is public, so no live gateway host is committed.
# The shape is what matters. It must be the SAME LLM or LiteLLM service the workloads on this
# cluster call — the judge is one more caller of it, and no two services share a key table — so
# substitute at apply time:
#
#     LLM_BASE=https://<that cluster's LLM service host>
#     sed "s|https://llm-gateway.example.com|$LLM_BASE|" deploy/kind/ibac-judge.yaml \
#       | kubectl --context kind-rossoctl apply -f -
#
# The key itself is NOT here. reference/kind-post-setup.sh creates the `ibac-judge-upstream` Secret
# and fills its `apikey`, then restarts this Deployment — the proxy reads the key once at start, so
# installing the key after the pod is up has no effect until it is recycled.
#
# Note for KinD specifically: stock KinD's `agentruntimes` CRD has no `pluginPreset` field, so the
# plugin legs of the matrix stay OpenShift-only even with this judge in place. It is here so the
# judge-call path can be exercised, not so the plugin legs can run.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ibac-judge-code
  namespace: rossoctl-system
  labels:
    app: ibac-judge
data:
  # Verbatim copy of what ykt2 runs. Deliberately stdlib-only: no pip install at container start,
  # so the pod is ready in seconds on a stock python image.
  proxy.py: |
    import os, socket, sys, time, urllib.request, urllib.error
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    UPSTREAM = os.environ.get("UPSTREAM_BASE", "").rstrip("/")
    KEY = os.environ.get("UPSTREAM_KEY", "")
    TIMEOUT = float(os.environ.get("UPSTREAM_TIMEOUT", "60"))
    # Connection-level failures are retried, because the request provably never reached the upstream:
    # a name that did not resolve, or a connection that was refused. On KinD the node's resolver answers
    # SERVFAIL now and then, and one failed lookup used to fail the judged task outright. A timeout or an
    # HTTP error is NOT retried — that request may have been served, and the judge must not bill twice.
    ATTEMPTS = int(os.environ.get("UPSTREAM_CONNECT_ATTEMPTS", "3"))
    BACKOFF = float(os.environ.get("UPSTREAM_CONNECT_BACKOFF", "0.5"))
    HOP = {"host", "authorization", "content-length", "connection",
           "transfer-encoding", "keep-alive", "upgrade"}


    def never_sent(e):
        """True if the request cannot have left this pod, so a retry cannot duplicate it."""
        r = getattr(e, "reason", None)
        return isinstance(e, urllib.error.URLError) and isinstance(r, (socket.gaierror, ConnectionRefusedError))


    def open_with_retry(req, opener=None, sleep=time.sleep):
        opener = opener or urllib.request.urlopen
        for attempt in range(1, ATTEMPTS + 1):
            try:
                return opener(req, timeout=TIMEOUT)
            except urllib.error.HTTPError:
                raise
            except Exception as e:
                if attempt == ATTEMPTS or not never_sent(e):
                    raise
                sys.stderr.write("upstream %s(%s), retrying (%d/%d)\n"
                                 % (type(e).__name__, type(e.reason).__name__, attempt, ATTEMPTS - 1))
                sleep(BACKOFF * attempt)


    def describe(e):
        """`URLError(gaierror)`: the class alone hid whether a failure was DNS, TCP or TLS."""
        r = getattr(e, "reason", None)
        return type(e).__name__ + ("(%s)" % type(r).__name__ if isinstance(r, BaseException) else "")


    class H(BaseHTTPRequestHandler):
        protocol_version = "HTTP/1.1"

        def log_message(self, fmt, *a):  # keep the key out of any log line
            sys.stderr.write("%s %s -> %s\n" % (self.command, self.path.split("?")[0], a[1] if len(a) > 1 else ""))

        def _health(self):
            body = b'{"status":"ok"}'
            self.send_response(200)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def _forward(self, method):
            if self.path in ("/healthz", "/health", "/ping"):
                return self._health()
            n = int(self.headers.get("Content-Length") or 0)
            body = self.rfile.read(n) if n else None
            hdrs = {k: v for k, v in self.headers.items() if k.lower() not in HOP}
            if KEY:
                hdrs["Authorization"] = "Bearer " + KEY
            req = urllib.request.Request(UPSTREAM + self.path, data=body, headers=hdrs, method=method)
            try:
                with open_with_retry(req) as r:
                    data, status, ct = r.read(), r.status, r.headers.get("Content-Type", "application/json")
            except urllib.error.HTTPError as e:
                data, status, ct = e.read(), e.code, e.headers.get("Content-Type", "application/json")
            except Exception as e:
                data, status, ct = ('{"error":"upstream: %s"}' % describe(e)).encode(), 502, "application/json"
            self.send_response(status)
            self.send_header("Content-Type", ct)
            self.send_header("Content-Length", str(len(data)))
            self.end_headers()
            self.wfile.write(data)

        def do_GET(self):
            self._forward("GET")

        def do_POST(self):
            self._forward("POST")


    if __name__ == "__main__":
        if not UPSTREAM:
            sys.exit("UPSTREAM_BASE is not set")
        ThreadingHTTPServer(("0.0.0.0", 8080), H).serve_forever()
---
apiVersion: v1
kind: Service
metadata:
  name: ibac-judge
  namespace: rossoctl-system
  labels:
    app: ibac-judge
spec:
  selector:
    app: ibac-judge
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ibac-judge
  namespace: rossoctl-system
  labels:
    app: ibac-judge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ibac-judge
  template:
    metadata:
      labels:
        app: ibac-judge
    spec:
      containers:
        - name: proxy
          image: mirror.gcr.io/library/python:3.12-slim
          command: ["python", "/app/proxy.py"]
          env:
            # PLACEHOLDER — substitute this cluster's own LLM service before applying (header).
            - name: UPSTREAM_BASE
              value: https://llm-gateway.example.com
            - name: UPSTREAM_KEY
              valueFrom:
                secretKeyRef:
                  name: ibac-judge-upstream
                  key: apikey
          ports:
            - containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: code
              mountPath: /app
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: code
          configMap:
            name: ibac-judge-code
